name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0, because scripts/released-contract.sh extracts the suite
      # from the last release tag and a shallow clone has no tags to find.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "::error::gofmt would change:"; echo "$out"; exit 1; }

      - run: go vet ./...
      - run: go test ./... -count=1 -race

      - name: the contract against the real binary, across a real restart
        # go test asserts durability by rebuilding the Store over the same spool,
        # which is what a new process does but is not one. This kills the binary
        # and starts it again, so the wiring in main.go is in the path too: a
        # relay that forgets to open its spool passes the unit tests and fails
        # here.
        run: |
          set -eu
          go build -o ./heliograph-relay ./cmd/heliograph-relay
          export HELIOGRAPH_RELAY_SPOOL=/tmp/spool
          export HELIOGRAPH_RELAY_ADDR=:8097
          export HELIOGRAPH_RELAY_ESTATES="e1:ctl:stn,e2:other-ctl:other-stn"
          # The contract's published lease key. A test fixture, not a secret:
          # the matching seed is in conformance/ so the suite can mint leases
          # this relay will accept. The relay holds only the public half.
          export HELIOGRAPH_RELAY_LEASE_KEY="79b5562e8fe654f94078b112e8a98ba7901f853ae695bed7e0e3910bad049664"
          ./scripts/restart-go-relay.sh
          for i in $(seq 1 30); do
            curl -sf http://localhost:8097/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8097/health || { cat /tmp/heliograph-relay.log; exit 1; }
          go run ./cmd/conformance -restart ./scripts/restart-go-relay.sh \
            http://localhost:8097 "go binary, durable"
          # And the contract as it was at the last release, unchanged, because a
          # station already deployed speaks that one and is not recompiled when
          # this repository is.
          ./scripts/released-contract.sh http://localhost:8097 "go binary"

      - name: no dependencies at all
        # This server has none and should never have any. It stores bytes and
        # moves them; anything it needed a library for would be something it
        # should not be doing.
        run: |
          if [ -f go.sum ]; then
            echo "::error::go.sum exists. This server has no dependencies by design."
            exit 1
          fi
          echo "no dependencies"

      - name: no cryptography beyond hashing and verification
        # The claim is that there is no key HERE WORTH STEALING and no plaintext
        # to subpoena. Three imports serve it and nothing else is permitted:
        #
        #   crypto/sha256   token and credential digests, never a message body
        #   crypto/subtle   constant-time comparison
        #   crypto/ed25519  VERIFYING authorisation lease signatures
        #
        # ed25519 was added deliberately and narrowly
        # (heliograph-io/heliograph-cloud#75). A public key is not a secret, so
        # the claim is untouched; the sentence that used to stand in for it,
        # "no cryptography in this repository", is what narrowed, and README.md,
        # SECURITY.md and relay.go each say so where they said the old thing.
        #
        # THIS STEP IS NOT WHAT KEEPS IT NARROW. An import list cannot tell
        # verifying from signing. The step below can.
        #
        # `go list` rather than grep, because grep cannot tell an import from a
        # string that looks like one. The check below names ed25519 symbols in
        # string literals, and a grep-based rule reported those as cryptographic
        # imports: a false alarm that would have been silenced by loosening the
        # rule, which is the worst possible outcome for a rule like this one.
        run: |
          set -euo pipefail
          bad=0
          while read -r imp; do
            case "$imp" in
              crypto/sha256|crypto/subtle|crypto/ed25519) ;;
              crypto/*) echo "::error::cryptographic import in the relay: $imp"; bad=1 ;;
            esac
          done < <(go list -f '{{join .Imports "\n"}}{{"\n"}}{{join .TestImports "\n"}}{{"\n"}}{{join .XTestImports "\n"}}' ./... | sort -u)
          [ "$bad" = "0" ] || exit 1
          echo "no cryptography beyond sha256, subtle and ed25519 verification"

      - name: the relay binary cannot sign a lease
        # THE STEP THAT CARRIES THE DECISION, and it is by construction rather
        # than by grep. Go links only reachable code, so a binary with no route
        # to CONSTRUCTING an ed25519 private key has no code path that could
        # sign anything - whatever any source file appears to import.
        #
        # A relay that could mint its own leases would be a relay that could
        # authorise itself for any estate, which is exactly the claim this whole
        # component rests on. The same assertion runs in `go test` as
        # TestTheRelayBinaryCannotSignALease; it is repeated here so a reviewer
        # reading CI sees the rule beside the others rather than having to know
        # a test name.
        run: |
          set -euo pipefail
          go build -o /tmp/relay-signcheck ./cmd/heliograph-relay
          # Written to a file rather than piped. `go tool nm | grep -q` makes nm
          # die of a broken pipe when grep exits early, and under pipefail that
          # fails the step for a reason that has nothing to do with the rule.
          go tool nm /tmp/relay-signcheck | awk '{print $NF}' > /tmp/relay-syms.txt
          found="$(grep -E '^crypto/ed25519\.(GenerateKey|sign|newKeyFromSeed)|^crypto/internal/fips140/ed25519\.(generateKey|newPrivateKey|newPrivateKeyFromSeed)' /tmp/relay-syms.txt || true)"
          if [ -n "$found" ]; then
            echo "::error::the relay binary links a route to an ed25519 private key, so it can mint leases:"
            echo "$found"
            exit 1
          fi
          # And it does verify, or the check above is satisfied by a binary that
          # simply does not do Ed25519 at all and proves nothing.
          if ! grep -q '^crypto/internal/fips140/ed25519.verify$' /tmp/relay-syms.txt; then
            echo "::error::the relay binary links no ed25519 verification, so the absence of signing proves nothing"
            exit 1
          fi
          echo "the relay verifies lease signatures and cannot produce one"

      - name: the image builds
        run: docker build -t heliograph-relay:test .

  reproducible:
    name: The relay builds the same twice, binary and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # THE CLAIM, MEASURED. relay.go says a reviewer can establish what this
      # server is incapable of by reading one small file. That only reaches the
      # deployed service if the deployed service is provably that source, and
      # "provably" means somebody else can build it and get the same bytes.
      #
      # BOTH BUILDS ARE FROM DIFFERENT DIRECTORIES, and the second from a copy
      # with no .git, because those are the two conditions that break it: Go
      # bakes the source path in without -trimpath and stamps the commit in
      # without -buildvcs=false, omitting the stamp silently where there is no
      # repository.
      - name: the Go relay binary
        run: |
          set -euo pipefail
          build() {
            ( cd "$1" && CGO_ENABLED=0 GOAMD64=v1 GOFLAGS= GOEXPERIMENT= \
                GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)" \
                go build -trimpath -buildvcs=false \
                  -ldflags "-s -w -X main.version=ci" \
                  -o "$2" ./cmd/heliograph-relay )
          }
          mkdir -p /tmp/elsewhere
          tar -c --exclude=.git . | tar -x -C /tmp/elsewhere
          build . /tmp/relay-a
          build /tmp/elsewhere /tmp/relay-b
          a="$(sha256sum /tmp/relay-a | cut -d" " -f1)"
          b="$(sha256sum /tmp/relay-b | cut -d" " -f1)"
          echo "$a"
          echo "$b"
          [ "$a" = "$b" ] || { echo "::error::the same source built twice produced different binaries"; exit 1; }

      - name: the Worker bundle
        run: |
          set -euo pipefail
          one="$(edge/reproduce.sh /tmp/bundle-a | sed -n "s/^sha256:[[:space:]]*//p")"
          mkdir -p /tmp/edge-elsewhere
          tar -c --exclude=.git --exclude=node_modules . | tar -x -C /tmp/edge-elsewhere
          two="$( cd /tmp/edge-elsewhere && edge/reproduce.sh /tmp/bundle-b | sed -n "s/^sha256:[[:space:]]*//p" )"
          echo "$one"
          echo "$two"
          [ -n "$one" ] || { echo "::error::no bundle hash was produced, so this checked nothing"; exit 1; }
          [ "$one" = "$two" ] || { echo "::error::the same source bundled twice produced different bytes"; exit 1; }

  edge:
    name: The Cloudflare Worker passes the same contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: install
        working-directory: edge
        # `npm ci`, not `npm install`: the lockfile is what pins the bundler,
        # and the bundle's hash is only reproducible if it is honoured.
        run: npm ci --no-fund --no-audit

      - name: typecheck
        working-directory: edge
        run: npm run typecheck

      - name: the storage model, which conformance cannot see
        # conformance/ is asserted over HTTP, and a storage model is not
        # observable to a client: memory and Durable Object storage answer every
        # request in that suite identically. That is how the two implementations
        # came to disagree behind one README sentence while both passed. These
        # tests run inside the Workers runtime and read storage directly.
        working-directory: edge
        run: npm test

      - name: start the worker locally
        # Through the same script the suite uses to restart it, so the thing
        # under test and the thing that restarts it cannot disagree about how it
        # is started.
        run: |
          ./scripts/restart-worker.sh
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8787/health || { cat /tmp/wrangler.log; exit 1; }

      - name: the same conformance suite the Go server runs, durability included
        # Two implementations, one contract. The cost of a second
        # implementation is drift, and drift is only dangerous when untested.
        #
        # -restart is what turns the durability assertions on: the suite cannot
        # take a relay away from itself, so the harness supplies the mechanism.
        # Without it those assertions report as skipped, which is visible in the
        # output rather than silently absent.
        run: |
          go run ./cmd/conformance -restart ./scripts/restart-worker.sh \
            http://localhost:8787 "cloudflare worker, durable"

      - name: the contract as it was at the last release, unchanged
        # conformance/ moves with the code, so a change that alters the wire and
        # updates the suite in the same commit passes it. Every station already
        # deployed speaks the RELEASED contract and is not recompiled when this
        # repository is, so the released suite is extracted from its tag and run
        # as it was.
        run: ./scripts/released-contract.sh http://localhost:8787 "cloudflare worker"

      - name: start a second worker behind a remote authoriser
        # The seam the hosted service lives behind. A seam nobody has run the
        # contract through is a seam that will drift from the one everybody
        # runs, so the Worker gets the same treatment as the Go server.
        working-directory: edge
        run: |
          npx wrangler dev --port 8788 --inspector-port 9230 --local \
            --var HELIOGRAPH_RELAY_AUTHORISER:"http://127.0.0.1:9797/decide" \
            --var HELIOGRAPH_RELAY_HOSTED:"1" \
            --var HELIOGRAPH_RELAY_LEASE_KEY:"79b5562e8fe654f94078b112e8a98ba7901f853ae695bed7e0e3910bad049664" \
            > /tmp/wrangler-authz.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8788/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8788/health || { cat /tmp/wrangler-authz.log; exit 1; }

      - name: an outage is not a bad credential, and one customer is not another
        # The suite runs the control plane itself, so it can take it away and so
        # it can bind credentials to stations.
        #
        # Two assertions this step exists for. A management-plane outage
        # reported as a credential problem sends the reader to the far side of
        # a gap when the fault is on this side
        # (heliograph-io/heliograph-cloud#7). And an estate-wide credential is
        # correct for a self-hoster and a tenant boundary failure the moment an
        # account holds two customers
        # (heliograph-io/heliograph-cloud#71).
        env:
          HELIOGRAPH_CONF_AUTHORISER: 127.0.0.1:9797
          HELIOGRAPH_CONF_TENANCY: "1"
        run: go run ./cmd/conformance http://localhost:8788 "cloudflare worker, hosted tenant behind a remote authoriser"

      - name: verification only at the edge
        # The same narrowing as the Go server, on the same terms
        # (heliograph-io/heliograph-cloud#75). The edge was included
        # deliberately: this is the relay almost every customer touches, and a
        # lease that could not be honoured here would leave the control-plane
        # outage protection absent from the only relay most people use.
        #
        # A bundle has no symbol table, so the rule is enforced on the source by
        # allowlisting the two calls that verify and forbidding every call that
        # could sign, generate or extract a key. importKey is additionally given
        # extractable:false and ["verify"] as its only usage, so the runtime
        # refuses to sign with the key or hand it back whatever this code asks.
        run: |
          set -euo pipefail
          if grep -rnE "subtle\.(sign|generateKey|deriveKey|deriveBits|exportKey|wrapKey|unwrapKey|encrypt|decrypt|digest)|createHash|WebCrypto" edge/src/*.ts; then
            echo "::error::the edge relay may verify a signature and nothing else. Signing, key generation and key extraction are forbidden."
            exit 1
          fi
          bad=0
          while read -r hit; do
            case "$hit" in
              *"crypto.subtle.importKey"*|*"crypto.subtle.verify"*) ;;
              *) echo "::error::cryptography at the edge beyond importKey and verify: $hit"; bad=1 ;;
            esac
          done < <(grep -rnE "crypto[.]|subtle[.]" edge/src/*.ts || true)
          [ "$bad" = "0" ] || exit 1
          echo "the worker verifies lease signatures and cannot produce one"
