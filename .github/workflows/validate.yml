name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "::error::gofmt would change:"; echo "$out"; exit 1; }

      - run: go vet ./...
      - run: go test ./... -count=1 -race

      - name: no dependencies at all
        # This server has none and should never have any. It stores bytes and
        # moves them; anything it needed a library for would be something it
        # should not be doing.
        run: |
          if [ -f go.sum ]; then
            echo "::error::go.sum exists. This server has no dependencies by design."
            exit 1
          fi
          echo "no dependencies"

      - name: no cryptography in this repository
        # The security claim is that there is no key here to leak and no
        # plaintext to subpoena. sha256 for token comparison is the sole
        # exception, and it never touches a message body.
        run: |
          set -euo pipefail
          bad=0
          while read -r hit; do
            case "$hit" in
              *crypto/sha256*|*crypto/subtle*) ;;
              *) echo "::error::cryptographic import in the relay: $hit"; bad=1 ;;
            esac
          done < <(grep -rn '"crypto/' --include='*.go' . || true)
          [ "$bad" = "0" ] || exit 1
          echo "no cryptography beyond constant-time token comparison"

      - name: the image builds
        run: docker build -t heliograph-relay:test .

  edge:
    name: The Cloudflare Worker passes the same contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: install
        working-directory: edge
        run: npm install --no-fund --no-audit

      - name: typecheck
        working-directory: edge
        run: npx tsc --noEmit

      - name: start the worker locally
        working-directory: edge
        run: |
          npx wrangler dev --port 8787 --local \
            --var HELIOGRAPH_RELAY_ESTATES:"e1:ctl:stn,e2:other-ctl:other-stn" \
            > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8787/health || { cat /tmp/wrangler.log; exit 1; }

      - name: the same conformance suite the Go server runs
        # Two implementations, one contract. The cost of a second
        # implementation is drift, and drift is only dangerous when untested.
        run: go run ./cmd/conformance http://localhost:8787 "cloudflare worker"

      - name: no cryptography in the worker either
        run: |
          if grep -rnE "crypto[.]|subtle[.]|WebCrypto|createHash" edge/src/*.ts; then
            echo "::error::cryptography in the edge relay. It stores ciphertext; it does not touch it."
            exit 1
          fi
          echo "no cryptography at the edge"
