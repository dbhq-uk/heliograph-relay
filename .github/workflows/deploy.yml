name: deploy

# Tagging deploys. Pushing to main does not.
#
# The relay other people's stations are talking to should change on a
# deliberate act, not as a side effect of merging a pull request. A tag is that
# act, and it is also the public source tag the provenance claim needs: the
# commit a reader can check the deployment against.
#
# This exists because the alternative was somebody running `wrangler deploy`
# from a laptop, which is how `/version` came to be needed at all. A workflow
# stamps the commit it is actually building, so the endpoint cannot be wrong
# about which commit it came from - a human passing the wrong `--var` can be.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to deploy'
        required: true

permissions:
  contents: read

concurrency:
  # Two deploys racing would leave the live version ambiguous, which is the
  # exact thing this is for.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the tagged commit and prove what answered
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # The same contract the validate workflow runs. A tag that cannot pass
      # conformance must not reach the thing in somebody's estate, and it is
      # cheaper to find out here than from a station that has gone quiet.
      - name: the contract, before anything is deployed
        run: go test ./...

      - name: install
        working-directory: edge
        # `npm ci`, not `npm install`. The lockfile is the pin: `install` may
        # resolve wrangler within ^4 and pick up a different bundler, and a
        # different bundler emits a different bundle - which would make the
        # hash below unreproducible for anybody following the documentation.
        run: npm ci --no-fund --no-audit

      - name: typecheck
        working-directory: edge
        run: npx tsc --noEmit

      # THE HASH OF WHAT IS ABOUT TO BE DEPLOYED, computed by the same script
      # `edge/reproduce.sh` gives a stranger. A Worker cannot read its own
      # bundle, so this is how /health can report the hash of the code that is
      # answering rather than only the commit somebody typed at a deploy.
      - name: hash the bundle
        id: bundle
        run: |
          set -euo pipefail
          out="$(edge/reproduce.sh /tmp/bundle)"
          echo "$out"
          echo "sha256=$(echo "$out" | sed -n 's/^sha256:[[:space:]]*//p')" >> "$GITHUB_OUTPUT"

      - name: deploy
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var VERSION:"${{ github.sha }}" \
            --var BUNDLE_SHA256:"${{ steps.bundle.outputs.sha256 }}"

      # Deploying is not the same as having deployed. Cloudflare propagates,
      # and a green deploy step with the old code still answering is precisely
      # the drift this whole endpoint exists to catch.
      # BOTH HOSTNAMES, because they are two custom domains on one script and
      # a route that failed to attach is invisible from the other one. A
      # station configured with either must reach the commit that was built.
      - name: prove the live relay is answering as this commit
        run: |
          want='${{ github.sha }}'
          for host in relay.heliograph.io heliograph-relay.dbhq.uk; do
            ok=''
            for i in $(seq 1 30); do
              got="$(curl -fsS "https://$host/version" \
                      | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')" || got=''
              [ "$got" = "$want" ] && { echo "$host is $got"; ok=1; break; }
              echo "attempt $i on $host: '${got:-unreachable}', want $want"
              sleep 5
            done
            [ -n "$ok" ] || {
              echo "::error::$host never reported $want. If the TLS handshake failed naming no certificate, read GET /zones/{zone}/ssl/certificate_packs?status=all and take the pack that is active rather than the first one naming the host."
              exit 1
            }
          done

      # AND THE HASH, which is the half a version string cannot give you.
      # Anybody can run edge/reproduce.sh against this tag and get this number;
      # if the live relay reports a different one, the deployment is not the
      # source, and the whole provenance claim rests on somebody noticing.
      - name: prove the live relay reports the bundle that was built
        run: |
          set -euo pipefail
          want='${{ steps.bundle.outputs.sha256 }}'
          [ -n "$want" ] || { echo "::error::the bundle hash was never computed"; exit 1; }
          for host in relay.heliograph.io heliograph-relay.dbhq.uk; do
            ok=''
            for i in $(seq 1 30); do
              got="$(curl -fsS "https://$host/health" \
                      | sed -n 's/.*"hash":"\([^"]*\)".*/\1/p')" || got=''
              [ "$got" = "$want" ] && { echo "$host bundle hash is $got"; ok=1; break; }
              echo "attempt $i on $host: '${got:-unreachable}', want $want"
              sleep 5
            done
            [ -n "$ok" ] || {
              echo "::error::$host never reported the bundle hash this deploy built"
              exit 1
            }
          done

      - name: and that it still passes the contract in production
        # Read-only against the live service: /health, /, /version. The queue
        # checks need estate credentials and are deliberately not run here.
        run: |
          for host in relay.heliograph.io heliograph-relay.dbhq.uk; do
            curl -fsS "https://$host/health" >/dev/null
            curl -fsS -H 'Accept: text/html' "https://$host/" \
              | grep -q '<title>heliograph relay</title>'
          done
