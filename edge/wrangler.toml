# The relay on Cloudflare's edge.
#
# One Durable Object per estate/station/direction. That granularity is not
# arbitrary: a DO is single-threaded and consistent, and a queue is exactly the
# thing that wants both. Splitting by route means one busy estate cannot make
# another wait.
name = "heliograph-relay"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "691c21cdcf1b3fa4add70cc166e99733"

# The hosted relay. Not a secret: an account id is an identifier, and this
# deployment being public is a feature of a product whose claim is that the
# relay cannot read your logs. Hiding how it is deployed would weaken that.
routes = [{ pattern = "heliograph-relay.dbhq.uk", custom_domain = true }]

# THREE LABELS, NOT FOUR, AND THAT IS THE WHOLE REASON FOR THE NAME.
#
# `relay.heliograph.dbhq.uk` was the first choice and it cannot be given a
# certificate on this plan. Cloudflare's Universal SSL covers `dbhq.uk` and
# `*.dbhq.uk` - ONE level of subdomain. A four-label host needs an advanced
# certificate pack, and advanced packs require Advanced Certificate Manager,
# which is a paid add-on. Without it the pack Cloudflare creates automatically
# sits in `pending_validation` forever.
#
# It does not fail in a way that says any of that. Every request returns a bare
# TLS handshake error naming no certificate at all, which reads exactly like a
# broken deployment when the deployment is fine.
#
# Check it rather than guessing:
#   GET /zones/{zone}/ssl/certificate_packs?status=all   -> status, and hosts
#   GET /zones/{zone}                                    -> plan
#
# `heliograph-relay.dbhq.uk` is three labels, covered by Universal SSL, free,
# and works immediately. The hostname is an API endpoint in a config file
# rather than branding, so the prettier name was not worth a subscription.

# Estate tokens are secrets, not vars. Set with:
#   wrangler secret put HELIOGRAPH_RELAY_ESTATES
# in the same estate:controlToken:stationToken form the Go server takes, so one
# format is documented once and works in both places.

[[durable_objects.bindings]]
name = "QUEUE"
class_name = "RelayQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayQueue"]

[observability]
enabled = true
